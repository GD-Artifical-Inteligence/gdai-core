[project]
name = "gdai-core"
version = "0.2.0"
description = "Cross-cutting mechanics shared by GD.AI services: HTTP client, error taxonomy, logging, health and settings."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdai_core"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "pyright>=1.1",
]

[tool.ruff.lint]
# BLE001 and TRY400 are the point: this repo starts at zero and stays there.
# A broad catch needs an explicit noqa, signed by whoever wrote it.
select = ["E", "F", "I", "BLE", "TRY"]
# TRY003 flags long messages inside raise. Our errors carry structured context
# in attributes and a readable message on top; the rule fights that on purpose.
ignore = ["TRY003"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
